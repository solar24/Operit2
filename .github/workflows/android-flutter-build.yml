name: Android Flutter Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 5

  build-android-v8:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pinned V8 version
        id: v8ver
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re
          lock = pathlib.Path("apps/flutter/native/operit-flutter-bridge/Cargo.lock").read_text()
          versions = set()
          for block in lock.split("[[package]]"):
              if re.search(r'^name = "v8"$', block, re.M):
                  versions.update(re.findall(r'^version = "([^"]+)"$', block, re.M))
          if len(versions) != 1:
              raise SystemExit("expected exactly one V8 version, got %s" % sorted(versions))
          print("version=" + versions.pop())
          PY

      - name: Restore Android V8 cache
        id: v8cache
        uses: actions/cache/restore@v4
        with:
          path: tools/release/work/android-v8
          key: linux-android-v8-v${{ steps.v8ver.outputs.version }}-ndk27-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Fetch V8 from release mirror
        id: v8mirror
        if: steps.v8cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V8_VERSION: ${{ steps.v8ver.outputs.version }}
        run: |
          set -uo pipefail
          asset="android-v8-v${V8_VERSION}-linux.tar.gz"
          dest="tools/release/work/android-v8"
          rm -rf "$dest"
          mkdir -p "$dest"
          rm -rf /tmp/v8-mirror
          if gh release download v8-mirror --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/v8-mirror 2>/dev/null              && tar -xzf "/tmp/v8-mirror/$asset" -C "$dest"              && test -n "$(find "$dest" -name librusty_v8.a -print -quit)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "restored $asset from release mirror"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "release mirror unavailable, V8 will be built from source"
          fi

      - name: Install V8 build tools
        if: steps.v8cache.outputs.cache-hit != 'true' && steps.v8mirror.outputs.ok != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            git \
            libclang-dev \
            libglib2.0-dev \
            lld \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            unzip \
            xz-utils \
            zlib1g-dev

      - name: Install Rust
        if: steps.v8cache.outputs.cache-hit != 'true' && steps.v8mirror.outputs.ok != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - name: Install Android NDK 27.3.13750724
        if: steps.v8cache.outputs.cache-hit != 'true' && steps.v8mirror.outputs.ok != 'true'
        run: |
          set -euo pipefail
          ndk_dir="$ANDROID_HOME/ndk/27.3.13750724"
          if [ ! -d "$ndk_dir" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750724"
          fi
          test -d "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64"

      - name: Install libclang 21 for bindgen
        if: steps.v8cache.outputs.cache-hit != 'true' && steps.v8mirror.outputs.ok != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y libclang-21-dev
          real="$(readlink -f /usr/lib/llvm-21/lib/libclang.so)"
          test -f "$real"
          echo "libclang real path: $real"
          sudo mkdir -p /usr/lib/llvm21/lib
          for alias in libclang.so libclang.so.1 libclang.so.21; do
            sudo ln -sf "$real" "/usr/lib/llvm21/lib/$alias"
          done
          ls -l /usr/lib/llvm21/lib
          ls /usr/lib/llvm-21/lib/clang/ 2>/dev/null || true
          python3 -c "import ctypes; ctypes.CDLL('/usr/lib/llvm21/lib/libclang.so'); print('libclang loads')"

      - name: Build Android V8 from source
        if: steps.v8cache.outputs.cache-hit != 'true' && steps.v8mirror.outputs.ok != 'true'
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          python3 tools/build_scripts/prepare_android_v8.py \
            --target aarch64-linux-android \
            --env-file /tmp/android-v8.env
          cat /tmp/android-v8.env

      - name: Verify restored Android V8 cache
        if: steps.v8cache.outputs.cache-hit == 'true' || steps.v8mirror.outputs.ok == 'true'
        run: |
          set -euo pipefail
          test -n "$(find tools/release/work/android-v8 -name librusty_v8.a -print -quit)"
          test -n "$(find tools/release/work/android-v8 -name src_binding.rs -print -quit)"
          test -n "$(find tools/release/work/android-v8 -name args.gn -print -quit)"
          test -n "$(find tools/release/work/android-v8 -name manifest.json -print -quit)"
          find tools/release/work/android-v8 -maxdepth 3 -type f | head -20

      - name: Publish V8 to release mirror
        if: steps.v8cache.outputs.cache-hit != 'true' && steps.v8mirror.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V8_VERSION: ${{ steps.v8ver.outputs.version }}
        run: |
          set -uo pipefail
          asset="android-v8-v${V8_VERSION}-linux.tar.gz"
          rm -f "/tmp/$asset"
          tar -I "gzip -1" -cf "/tmp/$asset" -C tools/release/work/android-v8 . || exit 0
          if ! gh release view v8-mirror --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v8-mirror --repo "$GITHUB_REPOSITORY" --title "Android V8 mirror" --notes "Reusable Android V8 static libraries for CI." || true
          fi
          gh release upload v8-mirror "/tmp/$asset" --repo "$GITHUB_REPOSITORY" --clobber || echo "mirror upload skipped"

      - name: Save Android V8 cache
        if: steps.v8cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/release/work/android-v8
          key: ${{ steps.v8cache.outputs.cache-primary-key }}

      - name: Upload Android V8 cache
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-v8-${{ github.sha }}
          path: tools/release/work/android-v8
          if-no-files-found: error
          retention-days: 5

  build-android:
    needs: [build-android-runtime, build-android-v8]
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/flutter/app/android/**/*.gradle.kts', 'apps/flutter/app/android/gradle/wrapper/gradle-wrapper.properties', 'apps/flutter/app/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Restore Cargo caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/flutter/native/operit-flutter-bridge/target/release
            apps/flutter/native/operit-flutter-bridge/target/aarch64-linux-android
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Restore Flutter SDK and pub caches
        uses: actions/cache@v4
        with:
          path: |
            ~/fvm
            ~/.fvm
            ~/AppData/Local/fvm
            ~/AppData/Local/Pub/Cache
            ~/AppData/Roaming/Pub/Cache
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('apps/flutter/app/.fvmrc') }}
          restore-keys: |
            flutter-${{ runner.os }}-

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/pnpm/store
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('plugins/packages/buildin/workflow/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Create plugin sync virtualenv
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -c "import sys; print('venv python', sys.version)"

      - name: Provision TypeScript compiler
        shell: pwsh
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          .\.ci-tools\typescript\node_modules\.bin\tsc.cmd --version

      - name: Enable Corepack pnpm shim
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.7.0 --activate
          pnpm --version

      - name: Install built-in workflow plugin dependencies
        shell: pwsh
        run: |
          Push-Location plugins/packages/buildin/workflow
          corepack pnpm install --frozen-lockfile
          Pop-Location

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Restore Android signing material
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $required = @(
            "ANDROID_RELEASE_KEYSTORE_BASE64",
            "ANDROID_RELEASE_STORE_PASSWORD",
            "ANDROID_RELEASE_KEY_ALIAS",
            "ANDROID_RELEASE_KEY_PASSWORD"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Actions secrets: $($missing -join ', ')"
          }
          $secretsDir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          $keystore = Join-Path $secretsDir "operit2-release.keystore"
          [System.IO.File]::WriteAllBytes($keystore, [System.Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64))
          @"
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=$env:ANDROID_RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$env:ANDROID_RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$env:ANDROID_RELEASE_KEY_PASSWORD
          "@ | Set-Content -Path (Join-Path $secretsDir "android-signing.properties") -Encoding utf8

      - name: Import Linux-built Android V8
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-v8-${{ github.sha }}
          path: tools/release/work/android-v8

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products app --github-runner

      - name: Build and package Android app
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value --enforce-lockfile

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14
